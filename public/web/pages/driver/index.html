<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FarmLink Driver — सारथी पोर्टल</title>
    <link rel="stylesheet" href="../../shared/assets/css/driver.css" />
  </head>
  <body>
    <div class="driver-app-frame no-bottom-nav" style="display:flex;align-items:center;justify-content:center;text-align:center;padding:32px 20px;">
      <div style="width:72px;height:72px;border-radius:24px;background:var(--primary);color:var(--lime);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:20px;box-shadow:var(--shadow-glow);">
        <i data-lucide="truck" style="width:36px;height:36px;"></i>
      </div>
      <h1 style="font-size:26px;margin-bottom:8px;">FarmLink <span style="color:var(--primary);">सारथी</span></h1>
      <p style="font-size:14.5px;color:var(--ink-soft);max-width:320px;margin-bottom:32px;">
        किसान से खरीदार तक — सुरक्षित, तेज़ और लाभकारी कृषि डिलीवरी पार्टनर नेटवर्क
      </p>

      <div style="width:100%;display:flex;flex-direction:column;gap:12px;">
        <a href="driver-dashboard.html" class="btn btn-primary">
          <span>ड्राइवर डैशबोर्ड खोलें (Open Dashboard)</span>
          <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
        </a>
        <a href="driver-registration.html" class="btn btn-secondary">
          <span>नया ड्राइवर पंजीकरण (New Registration)</span>
        </a>
      </div>

      <div style="margin-top:40px;font-size:12px;color:var(--ink-muted);display:flex;align-items:center;gap:6px;">
        <i data-lucide="shield-check" style="width:14px;height:14px;color:var(--success);"></i>
        <span>100% सुरक्षित और पारदर्शी भुगतान</span>
      </div>
    </div>

    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
