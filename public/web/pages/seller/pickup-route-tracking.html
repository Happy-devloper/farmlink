<!doctype html>
<html lang="hi"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>पिकअप ट्रैकिंग · FarmLink</title><link rel="stylesheet" href="../../shared/assets/css/design-system.css" /><link rel="stylesheet" href="../../shared/assets/css/components.css" /><link rel="stylesheet" href="../../shared/assets/css/compact-ui.css" /><link rel="stylesheet" href="../../shared/assets/css/style.css" /></head>
<body><div id="app-shell"><div class="main-col"><div id="topbar-slot"></div><main class="content" style="max-width:900px">
  <div class="card-title-row" style="margin-bottom:14px"><div><h1 style="margin-bottom:4px">पिकअप और डिलीवरी</h1><p>आपकी फसलों की लॉजिस्टिक्स स्थिति</p></div><button id="refreshPickup" class="btn btn-secondary btn-sm">रिफ्रेश</button></div>
  <div id="pickupMessage" class="alert alert-info">पिकअप जानकारी लोड हो रही है…</div><div id="pickupList" style="display:grid;gap:16px;margin-top:16px"></div>
  <div id="emptyPickup" class="empty-state" style="display:none"><h2>कोई सक्रिय पिकअप नहीं है</h2><p>ऑर्डर स्वीकार होने और ड्राइवर assign होने पर उसकी जानकारी यहाँ दिखेगी।</p><a href="seller-orders.html" class="btn btn-secondary">ऑर्डर देखें</a></div>
</main></div></div><script src="../../shared/assets/js/app.js"></script><script src="../../shared/assets/js/ui.js"></script>
<script>
  initShell("seller","pickup","पिकअप और डिलीवरी");
  const $=(id)=>document.getElementById(id), state={client:null,userId:null,shipments:[]};
  const esc=(v)=>String(v??"").replace(/[&<>'"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c]);
  const date=(v)=>v?new Date(v).toLocaleString("hi-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}):"समय उपलब्ध नहीं";
  const tracking=(status)=>({assigned:["ड्राइवर assign हुआ","pill-info",1],picked_up:["फसल पिकअप हो गई","pill-info",2],in_transit:["रास्ते में","pill-warn",3],delivered:["डिलीवर हो गया","pill-success",4]})[status]||["ड्राइवर assignment का इंतज़ार","pill-neutral",0];
  function timeline(stage){const steps=["ऑर्डर स्वीकार","ड्राइवर assign","पिकअप","रास्ते में","डिलीवर"];return `<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">${steps.map((label,index)=>`<span class="pill ${index<=stage?"pill-success":"pill-neutral"}">${index<stage?"✓ ":""}${label}</span>`).join("")}</div>`;}
  function render(){const list=$("pickupList");list.innerHTML=state.shipments.map((item)=>{const [label,pill,stage]=tracking(item.delivery?.tracking_status);const driver=item.driver;return `<article class="card"><div class="card-title-row"><div><h2 style="margin:0">ऑर्डर <span class="mono">#${esc(String(item.orderId).slice(0,8))}</span></h2><p style="margin:4px 0 0">${esc(item.crops.join(", "))}</p></div><span class="pill ${pill}">${label}</span></div>${timeline(stage)}<div class="grid grid-2" style="margin-top:16px;gap:12px"><div><strong>पिकअप पता</strong><p style="margin:4px 0 0">${esc(item.delivery?.pickup_address||"ड्राइवर assign होने पर उपलब्ध होगा")}</p></div><div><strong>डिलीवरी पता</strong><p style="margin:4px 0 0">${esc(item.delivery?.dropoff_address||item.order.delivery_address||"उपलब्ध नहीं")}</p></div><div><strong>ड्राइवर</strong><p style="margin:4px 0 0">${esc(driver?.full_name||"अभी assign नहीं हुआ")}${driver?.phone_number?` · <a href="tel:${esc(driver.phone_number)}">${esc(driver.phone_number)}</a>`:""}</p></div><div><strong>अनुमानित समय</strong><p style="margin:4px 0 0">${date(item.delivery?.estimated_arrival_time)}</p></div></div></article>`;}).join("");$("emptyPickup").style.display=state.shipments.length?"none":"block";}
  async function sellerOrderItems(){const {data:listings,error}=await state.client.from("listings").select("id,title").eq("farmer_id",state.userId);if(error)throw error;const map=new Map((listings||[]).map((row)=>[row.id,row]));const groups=new Map();await Promise.all([...map.keys()].map(async(listingId)=>{const result=await state.client.from("order_items").select("order_id,listing_id").eq("listing_id",listingId);if(result.error)throw result.error;(result.data||[]).forEach((item)=>groups.set(item.order_id,[...(groups.get(item.order_id)||[]),map.get(item.listing_id)?.title||"फसल"]));}));return groups;}
  async function load(){ $("pickupMessage").style.display="block";const itemsByOrder=await sellerOrderItems();const statusResult=await state.client.from("seller_order_status").select("order_id,status").eq("seller_id",state.userId);if(statusResult.error)throw statusResult.error;const sellerStatuses=new Map((statusResult.data||[]).map((entry)=>[entry.order_id,entry.status]));const rows=await Promise.all([...itemsByOrder.keys()].map(async(orderId)=>{const [orderResult,deliveryResult]=await Promise.all([state.client.from("orders").select("id,delivery_address").eq("id",orderId).maybeSingle(),state.client.from("deliveries").select("id,driver_id,pickup_address,dropoff_address,tracking_status,estimated_arrival_time").eq("order_id",orderId).maybeSingle()]);if(orderResult.error)throw orderResult.error;if(deliveryResult.error)throw deliveryResult.error;let driver=null;if(deliveryResult.data?.driver_id){const result=await state.client.from("users").select("full_name,phone_number").eq("id",deliveryResult.data.driver_id).maybeSingle();if(result.error)throw result.error;driver=result.data;}return {orderId,order:orderResult.data,delivery:deliveryResult.data,driver,crops:itemsByOrder.get(orderId),sellerStatus:sellerStatuses.get(orderId)||"pending"};}));state.shipments=rows.filter((row)=>row.order&&row.sellerStatus!=="cancelled"&&row.sellerStatus!=="pending").sort((a,b)=>new Date(b.delivery?.estimated_arrival_time||0)-new Date(a.delivery?.estimated_arrival_time||0));render();$("pickupMessage").style.display="none";}
  function fail(error){console.error("Pickup load failed:",error);$("pickupMessage").textContent=`पिकअप जानकारी लोड नहीं हुई: ${error.message}`;$("pickupMessage").className="alert alert-error";}
  $("refreshPickup").addEventListener("click",()=>load().catch(fail));(async()=>{try{await window.firebaseScriptReady;const {client,user}=await getCurrentUser();if(!user)return;state.client=client;state.userId=user.id;await load();}catch(error){fail(error);}})();
</script></body></html>
